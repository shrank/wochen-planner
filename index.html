<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Wochenplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --rule:#D9D2BF;
    --ink:#2E2B26;
    --ink-soft:#7A7364;
    --margin:#B65C4E;
    --check:#57705C;
    --drop:#EAF2EC;
    --drop-border:#57705C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#FFFFFF;
    min-height:100vh;
    font-family:'Comic Neue', 'Comic Sans MS', cursive;
    color:var(--ink);
    padding:58px 12px 48px;
    overflow-x:auto;
  }
  .sheet{
    width:100%;
    margin:0 auto;
    background:var(--paper);
    position:relative;
    padding-top:6px;
  }
  /* In sideways (90°/270°) mode, whichever local edge lands on the visual
     right after rotation gets extra inset, clearing space for a phone's
     control bar overlapping that side. Which local edge that is depends on
     rotation direction — see applyRotation(). */
  .sheet.edge-inset-top{ padding-top:56px; } /* 6px base + 50px inset */
  .sheet.edge-inset-bottom{ padding-bottom:50px; }
  #stageViewport{
    width:100%;
    transform-origin:center center;
    transition:transform 0.4s ease;
  }
  /* Sideways (90°/270°) orientation: the viewport itself becomes a fixed,
     full-screen, independently-scrolling box sized to the swapped
     width/height, then rotated+translated back into place. Scrolling then
     happens natively inside this box's own (pre-rotation) coordinate frame,
     so it can never drift out of alignment regardless of scroll position or
     content height — unlike measuring/centering pixel offsets by hand. */
  #stageViewport.rotated-host{
    position:fixed;
    top:0;
    left:0;
    width:100vh;
    height:100vw;
    transform-origin:top left;
    overflow:auto;
    background:var(--paper);
    z-index:500;
  }
  body.rotated-lock{
    overflow:hidden;
  }
  .rotate-btn{
    position:fixed;
    top:14px;
    left:14px;
    z-index:1000;
    width:38px;
    height:38px;
    border-radius:50%;
    border:1.5px solid var(--rule);
    background:#fff;
    color:var(--ink);
    font-size:1.15rem;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  .rotate-btn:hover{background:#f7f5ef;}
  .rotate-btn:active{transform:scale(0.92);}
  .titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:0 28px 10px;
  }
  .titlebar h1{
    font-family:'Comic Neue', 'Comic Sans MS', cursive;
    font-weight:700;
    font-size:1.6rem;
    margin:0;
    color:var(--ink);
    letter-spacing:0.5px;
  }
  .titlebar .week-nav{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .week-nav button{
    font-family:'Inter',sans-serif;
    border:1px solid var(--rule);
    background:#fff;
    color:var(--ink);
    border-radius:5px;
    padding:3px 9px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .week-nav button:hover{background:#faf8f2;}
  .close-week-btn.closed{
    border-color:var(--margin);
    color:var(--margin);
  }
  .save-status{
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
    cursor:default;
    transition:background .2s, color .2s;
  }
  .save-status.pending{ background:#f7f5ef; color:var(--ink-soft); }
  .save-status.saving{ background:#e8e4d8; color:var(--ink); }
  .save-status.saved{ background:#eaf2ec; color:var(--check); }
  .save-status.error-save,
  .save-status.error-load{
    background:#f9e8e6;
    color:var(--margin);
    cursor:pointer;
  }
  .save-status.conflict{
    background:#fff4d9;
    color:#8a6d1f;
    cursor:pointer;
  }
  .save-status.cached{
    background:#e6f2ff;
    color:#2f6f9f;
  }

  /* ===== Days grid ===== */
  .days-scroll{
    overflow-x:auto;
    padding:0 0 10px;
  }
  .days-grid-wrap{
    position:relative;
  }
  .closed-mark{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    display:none;
  }
  .closed-mark.show{ display:block; }
  .closed-mark line{
    stroke:var(--margin);
    stroke-width:0.6;
    opacity:0.5;
  }
  .days-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    width:100%;
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--rule);
  }
  .day-col{
    border-left:1px solid var(--rule);
    position:relative;
    padding:10px 8px 10px 10px;
  }
  .day-col:first-child{border-left:none;}
  .day-head{
    font-weight:700;
    font-size:1.05rem;
    padding-bottom:5px;
    margin-bottom:6px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .day-head .datenum{
    font-family:'Inter',sans-serif;
    font-size:0.68rem;
    color:var(--ink-soft);
    font-weight:500;
  }
  /* current-day highlight (only when viewing the week that contains today) */
  .day-col.today{ background:#FBF3E6; }
  .day-col.today .day-head{ border-bottom-color:var(--margin); }
  .day-col.today .day-head span:first-child{ color:var(--margin); }
  .day-col.today .day-head .datenum{
    color:var(--margin);
    border:1.5px solid var(--margin);
    border-radius:8px;
    padding:0 5px;
  }
  .slot{
    display:flex;
    align-items:flex-start;
    gap:5px;
    border-bottom:1px solid var(--rule);
    padding:5px 2px 4px;
    min-height:28px;
    transition:background 0.12s;
  }
  .dot{
    width:13px;height:13px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    margin-top:2px;
    flex:0 0 auto;
    cursor:pointer;
    background:transparent;
  }
  .dot.done{
    background:var(--check);
    border-color:var(--check);
  }
  .entry-wrap{
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  .entry{
    outline:none;
    font-size:0.98rem;
    line-height:1.25;
    color:var(--ink);
    word-break:break-word;
    min-width:0;
  }
  .entry.done{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .entry:empty::before{
    content:attr(data-placeholder);
    color:#c9c2ac;
  }
  .entry-time{
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-right:3px;
  }
  .meta{
    font-family:'Inter',sans-serif;
    font-size:0.66rem;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .del-btn{
    opacity:0;
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:0.85rem;
    line-height:1;
    padding:2px;
    flex:0 0 auto;
  }
  .slot:hover .del-btn, .note-line:hover .del-btn{opacity:0.6;}
  .del-btn:hover{opacity:1 !important; color:var(--margin);}

  /* empty items: no controls, just a clean blank line */
  .slot.empty .dot,
  .note-line.empty .dash,
  .note-line.empty .dot,
  .note-line.empty .del-btn{
    display:none !important;
  }
  .add-line{
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
    border:none;
    background:none;
    cursor:pointer;
    padding:6px 0 0;
  }
  .add-line:hover{color:var(--ink);}

  /* drag states */
  .drop-target{
    background:var(--drop) !important;
    outline:2px dashed var(--drop-border);
    outline-offset:-2px;
  }
  .move-source{
    background:var(--drop) !important;
    outline:2px solid var(--drop-border);
    outline-offset:-2px;
  }
  body.move-mode [data-loc-type]:not(.move-source){
    outline:1px dashed var(--drop-border);
    outline-offset:-2px;
  }

  /* ===== Notes boxes ===== */
  .notes-row{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    border-top:2px solid var(--ink);
  }
  .note-box{
    flex:1 1 220px;
    min-width:220px;
    padding:12px 20px 16px;
    border-left:1px solid var(--rule);
  }
  .note-box:first-child{border-left:none;}
  .note-head{
    font-weight:700;
    font-size:1.05rem;
    padding-bottom:5px;
    margin-bottom:8px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .notelines{
    min-height:20px;
  }
  .note-line{
    display:flex;
    align-items:flex-start;
    gap:4px;
    padding:4px 0;
  }
  [data-loc-type]{ cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .dash{color:var(--ink-soft); flex:0 0 auto; margin-top:1px;}
  .note-entry-wrap{
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  .note-entry{
    outline:none;
    font-size:0.98rem;
    color:var(--ink);
    min-width:0;
    word-break:break-word;
  }
  .note-entry.done{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .note-entry:empty::before{
    content:attr(data-placeholder);
    color:#c9c2ac;
  }

  /* "Ausblick" next-week lookahead */
  .preview-block{
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed var(--rule);
  }
  .preview-head{
    font-family:'Inter',sans-serif;
    font-size:0.64rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .preview-day{ margin-bottom:6px; }
  .preview-day-name{
    font-family:'Inter',sans-serif;
    font-size:0.7rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .preview-line{
    font-size:0.9rem;
    color:var(--ink-soft);
    padding:2px 0 2px 8px;
    cursor:pointer;
  }
  .preview-line:hover{ color:var(--ink); }

  .footer-note{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    color:#8a8370;
    padding:10px 0 4px;
  }

  @media (max-width:640px){
    .titlebar{padding:0 16px 10px;flex-direction:column;align-items:flex-start;gap:6px;}
  }

  /* ===== Shit-Liste (collapsible backlog) ===== */
  .shit-section{
    border-top:2px solid var(--ink);
  }
  .shit-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:9px 20px 7px;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .shit-head h2{
    font-weight:700;
    font-size:1.05rem;
    margin:0;
    letter-spacing:0.5px;
  }
  .shit-count{
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
  }
  .shit-toggle{
    margin-left:auto;
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
  }
  .shit-head:hover .shit-toggle{ color:var(--ink); }
  .shit-body{
    display:none;
    padding:0 20px 14px;
  }
  .shit-body.open{ display:block; }
  .shit-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    width:100%;
    border-top:1px solid var(--rule);
  }
  .shit-cell{
    display:flex;
    align-items:flex-start;
    gap:4px;
    min-height:36px;
    padding:5px 6px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .shit-cell:nth-child(6n){ border-right:none; }
  .shit-entry-wrap{
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  .shit-text{
    outline:none;
    font-size:0.95rem;
    color:var(--ink);
    min-width:0;
    word-break:break-word;
  }
  .shit-text:empty::before{
    content:attr(data-placeholder);
    color:#c9c2ac;
  }
  .shit-text.done{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .shit-cell.empty .del-btn{ display:none; }
  .shit-cell:hover .del-btn{ opacity:0.6; }
  .modal-actions-left{ display:flex; gap:8px; align-items:center; }
  .modal-btn.shit-btn{ font-size:1rem; padding:5px 10px; line-height:1; }
  .modal-btn.shit-btn.off{ display:none; }

  /* ===== Edit modal (always upright, independent of page rotation) ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(30,28,24,0.4);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    z-index:3000;
    padding:16px 16px 16px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background:#fff;
    border-radius:10px;
    width:min(92vw, 400px);
    padding:18px 18px 14px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,0.35);
    font-family:'Comic Neue', 'Comic Sans MS', cursive;
  }
  .modal-datetime{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  .modal-datetime label{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:3px;
    font-family:'Inter',sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
  }
  .modal-datetime input{
    font-family:'Inter',sans-serif;
    font-size:0.88rem;
    padding:6px 7px;
    border:1px solid var(--rule);
    border-radius:6px;
    color:var(--ink);
  }
  #modalText{
    width:100%;
    min-height:120px;
    resize:vertical;
    font-family:'Comic Neue', 'Comic Sans MS', cursive;
    font-size:1rem;
    line-height:1.35;
    color:var(--ink);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:9px 10px;
    outline:none;
  }
  #modalText:focus{ border-color:var(--check); }
  .modal-hint{
    font-family:'Inter',sans-serif;
    font-size:0.68rem;
    color:var(--ink-soft);
    margin:5px 2px 12px;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-actions-right{ display:flex; gap:8px; }
  .modal-btn{
    font-family:'Inter',sans-serif;
    font-size:0.85rem;
    border:1px solid var(--rule);
    background:#fff;
    color:var(--ink);
    border-radius:6px;
    padding:7px 13px;
    cursor:pointer;
  }
  .modal-btn:hover{ background:#f7f5ef; }
  .modal-btn.primary{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .modal-btn.primary:hover{ background:#454037; }
  .modal-btn.danger{
    color:var(--margin);
    border-color:transparent;
    background:none;
    padding-left:2px;
  }
  .modal-btn.danger:hover{ text-decoration:underline; background:none; }
</style>
</head>
<body>

<button class="rotate-btn" id="rotateBtn" title="Seite drehen" aria-label="Seite um 90° drehen">↻</button>

<div id="stageViewport">
<div class="sheet" id="stage">
  <div class="titlebar">
    <h1 id="weekLabel">Wochenplaner</h1>
    <div class="week-nav">
      <button id="prevWeek">‹ Vorige</button>
      <span id="weekRange"></span>
      <span id="saveStatus" class="save-status"></span>
      <button id="nextWeek">Nächste ›</button>
      <button id="closeWeekBtn" class="close-week-btn"></button>
    </div>
  </div>

  <div class="days-scroll">
    <div class="days-grid-wrap">
      <div class="days-grid" id="daysGrid"></div>
      <svg class="closed-mark" id="closedMark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="0" x2="100" y2="100"></line>
        <line x1="100" y1="0" x2="0" y2="100"></line>
      </svg>
    </div>
  </div>

  <div class="notes-row" id="notesRow"></div>

  <div class="shit-section" id="shitSection">
    <div class="shit-head" id="shitHead" role="button" tabindex="0" aria-expanded="false" aria-controls="shitBody">
      <h2>💩 Shit-Liste</h2>
      <span class="shit-count" id="shitCount"></span>
      <span class="shit-toggle" id="shitToggle">anzeigen</span>
    </div>
    <div class="shit-body" id="shitBody"></div>
  </div>

  <div class="footer-note" id="footerNote">Zum Bearbeiten tippen · Punkt anklicken zum Erledigen · lang drücken, dann Ziel antippen · gespeichert automatisch</div>
</div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-datetime">
      <label>Datum
        <input type="date" id="modalDate">
      </label>
      <label>Uhrzeit
        <input type="time" id="modalTime">
      </label>
    </div>
    <textarea id="modalText" placeholder="Text…" rows="5"></textarea>
    <div class="modal-hint">Erste Zeile erscheint in der Wochenübersicht.</div>
    <div class="modal-actions">
      <div class="modal-actions-left">
        <button class="modal-btn danger" id="modalClear">Leeren</button>
        <button class="modal-btn shit-btn" id="modalShit" title="Auf die Shit-Liste verschieben">💩</button>
      </div>
      <div class="modal-actions-right">
        <button class="modal-btn" id="modalCancel">Abbrechen</button>
        <button class="modal-btn primary" id="modalSave">Speichern</button>
      </div>
    </div>
  </div>
</div>

<script>
const DAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const NOTE_SECTIONS = ["Diverses","Kaufen","Ausblick"];
const DRAG_SECTIONS = ["Diverses","Kaufen"];
const SLOTS_PER_DAY = 8;
const SHIT_COLS = 6;
const SHIT_MIN_CELLS = 48;
const SHIT_MAX_ITEMS = 400;
const SHIT_MAX_TEXT_BYTES = 8000; // must match the per-item limit in api.php
function textTooLong(t){ return new TextEncoder().encode(t || '').length > SHIT_MAX_TEXT_BYTES; }

const daysGrid = document.getElementById('daysGrid');
const notesRow = document.getElementById('notesRow');
const weekLabel = document.getElementById('weekLabel');
const weekRange = document.getElementById('weekRange');
const closedMark = document.getElementById('closedMark');
const closeWeekBtn = document.getElementById('closeWeekBtn');
const shitHead = document.getElementById('shitHead');
const shitBody = document.getElementById('shitBody');
const shitToggle = document.getElementById('shitToggle');
const shitCount = document.getElementById('shitCount');

let currentWeekStart = getMonday(new Date());
let data = null;
let nextWeekPreview = null; // flat list of {day, text, date, time, done} for the "Ausblick" lookahead
let previewRequestId = 0;
let currentRevision = 0;
let saveTimer = null;
let dirty = false;
let saveInFlight = false;
let reDirty = false;
let saveBlocked = false;
let revisionPollTimer = null;
let lastConflict = null;
let saveErrorAlerted = false;
let shit = null; // { items: [{text,date,time,done}], revision } — global backlog
let shitDirty = false;
let shitSaveTimer = null;
let shitInFlight = false;
let shitReDirty = false;
let shitSaveErrorAlerted = false;
let shitSaveFailed = false;
let shitNeedsPaint = true;
let weekSaveFailed = false;
let shitCapAlerted = false;
let shitTooLongAlerted = false;
let shitConflictResolving = false; // conflict dialog running: backlog-cell dialogs/moves blocked
let shitMoveSeq = 0;
const SAVE_DEBOUNCE_MS = 400;
const MAX_RETRIES = 2;
const BACKUP_TTL_MS = 7 * 24 * 60 * 60 * 1000;

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}
function weekParam(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const API_URL = 'api.php';
function mondayForDateStr(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return null;
  return getMonday(d);
}
function dateToDayName(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return null;
  const idx = (d.getDay() + 6) % 7; // Monday=0 ... Sunday=6, matches DAYS order
  return DAYS[idx];
}
function fmtRange(monday){
  const opts = {day:'numeric', month:'short'};
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate()+6);
  return monday.toLocaleDateString('de-DE',opts) + ' – ' + sunday.toLocaleDateString('de-DE',opts);
}
function fmtDayNum(monday, idx){
  const d = new Date(monday);
  d.setDate(d.getDate()+idx);
  return d.getDate() + '.' + (d.getMonth()+1) + '.';
}
// ISO-8601 calendar week: anchor on the week's Thursday, week 1 contains Jan 4.
function isoWeekNumber(monday){
  const thursday = new Date(monday);
  thursday.setDate(thursday.getDate() + 3);
  const week1Monday = getMonday(new Date(thursday.getFullYear(), 0, 4));
  return Math.floor(((thursday - week1Monday) / 86400000) / 7) + 1;
}
// 0-based index of today in DAYS when the viewed week contains today, else -1
function todayDayIndex(){
  const now = new Date();
  if(weekParam(getMonday(now)) !== weekParam(currentWeekStart)) return -1;
  return (now.getDay() + 6) % 7;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

function emptySlot(){ return {text:'', date:'', time:'', done:false}; }
function newNoteItem(){ return {id:uid(), text:'', date:'', time:'', done:false}; }

function firstLine(text){
  return (text || '').split('\n')[0];
}
function isItemEmpty(item){
  return !item.text.trim() && !item.date && !item.time;
}
function formatMeta(item){
  const parts = [];
  if(item.date){
    const d = new Date(item.date + 'T00:00:00');
    if(!isNaN(d)) parts.push(d.getDate() + '.' + (d.getMonth()+1) + '.');
  }
  if(item.time) parts.push(item.time);
  return parts.join(' · ');
}
function formatDateOnly(item){
  if(!item.date) return '';
  const d = new Date(item.date + 'T00:00:00');
  if(isNaN(d)) return '';
  return d.getDate() + '.' + (d.getMonth()+1) + '.';
}

function defaultData(){
  const days = {};
  DAYS.forEach(d => days[d] = Array.from({length:SLOTS_PER_DAY}, emptySlot));
  const notes = {};
  NOTE_SECTIONS.forEach(n => notes[n] = [ newNoteItem() ]);
  return {days, notes, closed:false};
}

function normalize(d){
  d = d || {};
  d.days = d.days || {};
  d.notes = d.notes || {};
  d.closed = !!d.closed;
  DAYS.forEach(day => {
    if(!Array.isArray(d.days[day])) d.days[day] = [];
    while(d.days[day].length < SLOTS_PER_DAY) d.days[day].push(emptySlot());
    if(d.days[day].length > SLOTS_PER_DAY) d.days[day] = d.days[day].slice(0, SLOTS_PER_DAY);
    d.days[day] = d.days[day].map(s => ({
      text: (s && s.text) || '',
      date: (s && s.date) || '',
      time: (s && s.time) || '',
      done: !!(s && s.done)
    }));
  });
  NOTE_SECTIONS.forEach(section => {
    if(!Array.isArray(d.notes[section]) || d.notes[section].length === 0){
      d.notes[section] = [ newNoteItem() ];
    } else {
      d.notes[section] = d.notes[section].map(i => ({
        id: i.id || uid(),
        text: i.text || '',
        date: i.date || '',
        time: i.time || '',
        done: !!i.done
      }));
    }
  });
  return d;
}

async function fetchWeekData(weekStart, allowCached){
  const week = weekParam(weekStart);
  try{
    const res = await fetch(`${API_URL}?week=${week}`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return normalize(await res.json());
  }catch(e){
    if(allowCached){
      const cached = loadCachedWeekFromLocal(weekStart);
      if(cached){
        const hit = normalize(cached.payload);
        hit.revision = cached.revision || 0;
        return hit;
      }
    }
    throw e;
  }
}
async function postApiJson(body){
  // keepalive lets the unload-time flushes survive the tab closing; the spec
  // rejects keepalive bodies over 64 KB, so large payloads skip the flag
  const text = JSON.stringify(body);
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: text,
    keepalive: text.length < 60000
  });
  const respBody = await res.json().catch(() => ({}));
  if(!res.ok){
    const err = new Error(respBody.error || ('HTTP ' + res.status));
    err.status = res.status;
    err.code = respBody.code;
    err.response = respBody;
    throw err;
  }
  return respBody;
}
async function postWeekData(weekStart, weekData, baseRevision, force){
  const week = weekParam(weekStart);
  const body = {
    week,
    days: weekData.days,
    notes: weekData.notes,
    closed: !!weekData.closed,
    base_revision: baseRevision
  };
  if(force) body.force = true;
  return postApiJson(body);
}

async function loadWeek(){
  cancelMove();
  setSaveStatus('loading');
  try{
    const loaded = await fetchWeekData(currentWeekStart, true);
    data = loaded;
    currentRevision = loaded.revision || 0;
    saveBlocked = false;
    saveErrorAlerted = false;
    weekSaveFailed = false;
    clearLocalBackup(currentWeekStart);
    setSaveStatus(shitSaveFailed ? 'error-save' : 'saved');
  }catch(e){
    console.error('Laden fehlgeschlagen', e);
    saveBlocked = true;
    setSaveStatus('error-load');
    if(!data){
      data = normalize(defaultData());
    }
    alert('Woche konnte nicht geladen werden. Offline-Zwischenspeicher wird angezeigt, falls vorhanden.');
  }
  render();
  loadNextWeekPreview();
  scheduleRevisionPoll();
}

// Fetches next week's day-grid items for the "Ausblick" lookahead; done
// items are skipped. Runs independently of loadWeek() so it never delays
// showing the current week; a request-id guard drops stale results if the
// user navigates again before this resolves.
async function loadNextWeekPreview(){
  const myRequestId = ++previewRequestId;
  const nextMonday = new Date(currentWeekStart);
  nextMonday.setDate(nextMonday.getDate() + 7);

  let preview = [];
  try{
    const nextData = await fetchWeekData(nextMonday, true);
    DAYS.forEach(day => {
      nextData.days[day].forEach(slot => {
        if(!isItemEmpty(slot) && !slot.done) preview.push({day, ...slot});
      });
    });
  }catch(e){
    console.error('Vorschau nächste Woche fehlgeschlagen', e);
    preview = [];
  }

  if(myRequestId !== previewRequestId) return; // superseded by a newer request
  nextWeekPreview = preview;
  render();
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  dirty = true;
  setSaveStatus('pending');
  saveTimer = setTimeout(saveWeek, SAVE_DEBOUNCE_MS);
}

async function saveWeek(){
  if(saveBlocked || !dirty) return;
  if(saveInFlight){ reDirty = true; return; }
  dirty = false;
  saveInFlight = true;
  setSaveStatus('saving');
  const weekSnapshot = currentWeekStart;
  const payload = JSON.parse(JSON.stringify(data)); // snapshot: retries must not pick up later edits
  const seqAtCopy = shitMoveSeq;
  const baseRevision = currentRevision;
  cacheWeekToLocal(weekSnapshot, payload, baseRevision);
  const longText = Object.values(payload.days || {}).some(list => list.some(it => textTooLong(it.text)))
    || Object.values(payload.notes || {}).some(list => list.some(it => textTooLong(it.text)));
  if(longText){
    // permanent client error: don't send a doomed payload, tell the user why
    saveInFlight = false;
    dirty = true;
    weekSaveFailed = true;
    backupWeekToLocal(weekSnapshot, payload, baseRevision);
    if(shitCanUsePill()) setSaveStatus('error-save');
    if(!saveErrorAlerted){
      saveErrorAlerted = true;
      alert('Ein Eintrag ist zu lang (max 8000 Byte). Bitte kürze ihn und tippe auf die Statusanzeige, um erneut zu speichern.');
    }
    return;
  }
  let attempt = 0;
  while(true){
    try{
      const result = await postWeekData(weekSnapshot, payload, baseRevision);
      if(weekSnapshot.getTime() === currentWeekStart.getTime()){
        currentRevision = result.revision;
      }
      saveInFlight = false;
      saveErrorAlerted = false;
      clearLocalBackup(weekSnapshot);
      cacheWeekToLocal(weekSnapshot, payload, result.revision);
      weekSaveFailed = false;
      if(lastShitMoveToWeek && lastShitMoveToWeek.seq <= seqAtCopy
         && lastShitMoveToWeek.week === weekParam(weekSnapshot)){
        lastShitMoveToWeek = null; // the saved week snapshot included this move
      }
      if(shitSaveFailed){
        setSaveStatus('error-save'); // the backlog still needs attention
      }else if((shitDirty || shitInFlight) && shitCanUsePill()){
        setSaveStatus('pending'); // the backlog save is still running
      }else{
        setSaveStatus('saved');
      }
      if(reDirty){
        reDirty = false;
        dirty = true;
        scheduleSave();
      }
      return;
    }catch(e){
      attempt++;
      if(e.status === 409){
        saveInFlight = false;
        handleConflict(e.response, payload, weekSnapshot);
        return;
      }
      if(e.status === 400){
        // permanent client error (e.g. overlong item text): no retry
        saveInFlight = false;
        dirty = true;
        weekSaveFailed = true;
        backupWeekToLocal(weekSnapshot, payload, baseRevision);
        if(shitCanUsePill()) setSaveStatus('error-save');
        if(!saveErrorAlerted){
          saveErrorAlerted = true;
          alert('Der Server hat die Änderung abgelehnt (z. B. Eintrag zu lang). Bitte korrigiere und tippe auf die Statusanzeige.');
        }
        console.error('Speichern abgelehnt (400)', e);
        return;
      }
      if(attempt > MAX_RETRIES){
        saveInFlight = false;
        dirty = true;
        backupWeekToLocal(weekSnapshot, payload, baseRevision);
        weekSaveFailed = true;
        if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
        if(!saveErrorAlerted){
          saveErrorAlerted = true;
          alert('Die letzte Änderung konnte nicht gespeichert werden. Sie wurde lokal zwischengespeichert – tippe auf die Statusanzeige, um es erneut zu versuchen.');
        }
        console.error('Speichern fehlgeschlagen', e);
        return;
      }
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
}

async function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  if(dirty || reDirty) await saveWeek();
}

function setSaveStatus(state, message){
  const el = document.getElementById('saveStatus');
  if(!el) return;
  const texts = {
    idle: '',
    loading: 'Laden…',
    saving: 'Speichern…',
    saved: 'Gespeichert',
    cached: 'Offline verfügbar',
    pending: 'Speichern anstehend…',
    'error-save': 'Nicht gespeichert – tippen zum Wiederholen',
    'error-load': 'Laden fehlgeschlagen',
    conflict: 'Konflikt – tippen zum Auflösen'
  };
  el.textContent = message || texts[state] || '';
  el.className = 'save-status ' + state;
  el.dataset.state = state;
  if(!el._hasClick){
    el._hasClick = true;
    el.addEventListener('click', () => {
      const st = el.dataset.state;
      if(st === 'error-save'){ if(dirty || reDirty) scheduleSave(); if(shitDirty || shitReDirty) scheduleShitSave(); }
      else if(st === 'error-load') loadWeek();
      else if(st === 'conflict' && lastConflict) showConflictPrompt();
      else if(st === 'cached'){
        const cached = loadCachedWeekFromLocal(currentWeekStart);
        if(cached){
          data = normalize(cached.payload);
          currentRevision = cached.revision || 0;
          saveBlocked = false;
          saveErrorAlerted = false;
          setSaveStatus('cached', 'Offline-Daten geladen');
          render();
          scheduleSave();
        }
      }
    });
  }
}

function localBackupKey(weekStart){
  return 'wp_backup_' + weekParam(weekStart);
}
function localCacheKey(weekStart){
  return 'wp_cache_' + weekParam(weekStart);
}
function backupWeekToLocal(weekStart, payload, baseRevision){
  try{
    localStorage.setItem(localBackupKey(weekStart), JSON.stringify({
      week: weekParam(weekStart),
      base_revision: baseRevision,
      payload,
      savedAt: Date.now()
    }));
  }catch(_){}
}
function clearLocalBackup(weekStart){
  try{
    localStorage.removeItem(localBackupKey(weekStart));
  }catch(_){}
}
function cacheWeekToLocal(weekStart, payload, revision){
  try{
    localStorage.setItem(localCacheKey(weekStart), JSON.stringify({
      week: weekParam(weekStart),
      revision,
      payload,
      savedAt: Date.now()
    }));
  }catch(_){}
}
function loadCachedWeekFromLocal(weekStart){
  try{
    const raw = localStorage.getItem(localCacheKey(weekStart));
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.payload || parsed.week !== weekParam(weekStart)) return null;
    if(Date.now() - (parsed.savedAt || 0) > BACKUP_TTL_MS){
      localStorage.removeItem(localCacheKey(weekStart));
      return null;
    }
    return parsed;
  }catch(_){ return null; }
}
function showConflictPrompt(){
  if(!lastConflict) return;
  handleConflict(lastConflict.response, lastConflict.payload, lastConflict.week, true);
}

async function handleConflict(response, ourPayload, weekSnapshot, fromPrompt){
  lastConflict = {response, payload: ourPayload, week: weekSnapshot};
  setSaveStatus('conflict');
  const server = response && response.server ? response.server : null;
  const msg = fromPrompt
    ? 'Diese Woche wurde zwischenzeitlich anderswo geändert. Wie soll der Konflikt aufgelöst werden?'
    : 'Diese Woche wurde zwischenzeitlich anderswo geändert (z. B. auf einem anderen Gerät).\n\n„OK“ = meine Version behalten (Server-Version überschreiben).\n„Abbrechen“ = Server-Version laden (eigene Änderungen verwerfen).';
  const choice = confirm(msg);
  if(choice){
    try{
      const serverRevision = response && response.revision ? response.revision : (server ? server.revision : 0);
      const result = await postWeekData(weekSnapshot, ourPayload, serverRevision, true);
      if(weekSnapshot.getTime() === currentWeekStart.getTime()){
        currentRevision = result.revision;
      }
      clearLocalBackup(weekSnapshot);
      weekSaveFailed = false;
      setSaveStatus(shitSaveFailed ? 'error-save' : 'saved');
      lastConflict = null;
    }catch(e){
      setSaveStatus('error-save');
      alert('Konnte Konflikt nicht auflösen. Bitte erneut versuchen.');
    }
  }else{
    if(server && weekSnapshot.getTime() === currentWeekStart.getTime()){
      data = normalize(server);
      reinsertShitMoveIntoWeek();
      scheduleSave(); // persist the re-inserted entry (idempotent when unchanged)
      currentRevision = server.revision || response.revision || 0;
      clearLocalBackup(weekSnapshot);
      weekSaveFailed = false;
      setSaveStatus(shitSaveFailed ? 'error-save' : 'pending'); // scheduleSave just queued a save
      lastConflict = null;
      render();
    }
  }
  if((dirty || reDirty) && weekSnapshot.getTime() === currentWeekStart.getTime()){
    scheduleSave();
  }
}

function scheduleRevisionPoll(){
  if(revisionPollTimer) clearInterval(revisionPollTimer);
  revisionPollTimer = setInterval(async () => {
    if(document.hidden) return;
    // shit-list changed elsewhere? (loadShit's guard keeps pending edits intact)
    if(shit && !shitDirty && !shitReDirty && !shitInFlight){
      try{
        const shitRes = await fetch(`${API_URL}?shitlist=1&revision_only=1`);
        if(shitRes.ok){
          const shitInfo = await shitRes.json();
          if(typeof shitInfo.revision === 'number' && shitInfo.revision !== shit.revision){
            loadShit();
          }
        }
      }catch(_){}
    }
    if(!saveBlocked && currentWeekStart && !saveInFlight){
      try{
        const week = weekParam(currentWeekStart);
        const res = await fetch(`${API_URL}?week=${week}&revision_only=1`);
      if(!res.ok) return;
      const info = await res.json();
      if(info.revision !== currentRevision){
        if(dirty || reDirty){
          setSaveStatus('conflict');
          alert('Achtung: Diese Woche wurde auf einem anderen Gerät geändert, während du noch nicht gespeicherte Änderungen hast. Bitte speichern oder neu laden.');
        }else{
          loadWeek();
        }
      }
      }catch(_){}
    }
  }, 20000);
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

        row.dataset.locType = 'note';
        row.dataset.locSection = section;
        row.dataset.locId = item.id;
      }
      const meta = formatMeta(item);
      const checkable = section === 'Kaufen' || section === 'Diverses';
      row.innerHTML = `
        ${checkable ? `<div class="dot ${item.done?'done':''}" data-toggle-section="${section}" data-toggle-id="${item.id}"></div>` : '<span class="dash">–</span>'}
        <div class="note-entry-wrap" data-open-section="${section}" data-open-id="${item.id}">
          <div class="note-entry ${item.done?'done':''}" data-placeholder="…">${escapeHtml(firstLine(item.text))}</div>
          ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ''}
        </div>

    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-line';
    addBtn.textContent = '+ Eintrag';

    box.appendChild(addBtn);

    if(section === 'Ausblick' && nextWeekPreview && nextWeekPreview.length){

        if(!items.length) return;

        dayBlock.className = 'preview-day';

  applyMoveHighlight();
