/* ===================== EVENT HANDLERS ===================== */

function attachHandlers(){
  // day slot: click to open edit modal
  daysGrid.querySelectorAll('[data-open-day]').forEach(el => {
    el.addEventListener('click', () => {
      if(moveSource || isClickSuppressed()) return;
      openModal({type:'day', day: el.dataset.openDay, index: parseInt(el.dataset.openIndex)});
    });
  });
  daysGrid.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('click', () => {
      if(isClickSuppressed()) return;
      const day = el.dataset.toggleDay, idx = parseInt(el.dataset.toggleIndex);
      data.days[day][idx].done = !data.days[day][idx].done;
      scheduleSave(); render();
    });
  });

  // note entries: click to open edit modal
  notesRow.querySelectorAll('[data-open-section]').forEach(el => {
    el.addEventListener('click', () => {
      if(moveSource || isClickSuppressed()) return;
      openModal({type:'note', section: el.dataset.openSection, id: el.dataset.openId});
    });
  });
  notesRow.querySelectorAll('.del-btn').forEach(el => {
    el.addEventListener('click', () => {
      if(isClickSuppressed()) return;
      const section = el.dataset.delSection;
      removeNoteItemById(section, el.dataset.delId);
      if(data.notes[section].length === 0) data.notes[section].push(newNoteItem());
      scheduleSave(); render();
    });
  });
  notesRow.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('click', () => {
      if(isClickSuppressed()) return;
      const section = el.dataset.toggleSection;
      const item = data.notes[section].find(i => i.id === el.dataset.toggleId);
      if(item){ item.done = !item.done; scheduleSave(); render(); }
    });
  });
  notesRow.querySelectorAll('[data-add-section]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(isClickSuppressed()) return;
      const section = btn.dataset.addSection;
      const item = newNoteItem();
      data.notes[section].push(item);
      scheduleSave(); render();
      openModal({type:'note', section, id: item.id});
    });
  });

  // long-press to start a move
  document.querySelectorAll('[data-loc-type="day"], [data-loc-type="note"]').forEach(el => {
    el.addEventListener('pointerdown', onRowPointerDown);
  });

  // "Ausblick" next-week preview: click a line to jump to that week
  notesRow.querySelectorAll('.preview-line').forEach(el => {
    el.addEventListener('click', (e) => {
      if(isClickSuppressed()) return;
      goToNextWeek(e);
    });
  });
}

function removeNoteItemById(section, id){
  const arr = data.notes[section];
  const idx = arr.findIndex(i => i.id === id);
  if(idx > -1) arr.splice(idx, 1);
}

/* ===================== SHIT-LISTE ===================== */
/* Global backlog section at the bottom of the page. Index-addressable like
   the day grid: empty cells are editable, holes between items stay put, and
   the grid always shows at least SHIT_MIN_CELLS cells and grows downwards. */

function getShitItem(index){
  const item = shit && shit.items ? shit.items[index] : null;
  return item ? {text:item.text, date:item.date, time:item.time, done:item.done}
              : {text:'', date:'', time:'', done:false};
}
// Writes a cell in place, padding holes before the index; trailing holes are trimmed.
function setShitItem(index, val){
  if(!shit || !Array.isArray(shit.items) || index < 0) return;
  if(index >= SHIT_MAX_ITEMS){ flashFooterHint('Die Shit-Liste ist voll (max 400 Einträge).'); return; }
  shitNeedsPaint = true;
  while(shit.items.length < index) shit.items.push(emptySlot());
  shit.items[index] = {text: val.text || '', date: val.date || '', time: val.time || '', done: !!val.done};
  while(shit.items.length && isItemEmpty(shit.items[shit.items.length - 1])) shit.items.pop();
}
function shitCellCount(){
  const len = shit && shit.items ? shit.items.length : 0;
  // always leave at least one tappable empty cell, even when the grid is "full";
  // never render beyond the cap — unreachable cells would silently lose moved entries
  return Math.min(SHIT_MAX_ITEMS, Math.max(SHIT_MIN_CELLS, Math.ceil((len + 1) / SHIT_COLS) * SHIT_COLS));
}
function normalizeShit(d){
  if(Array.isArray(d)) d = { items: d }; // accept both shapes so misuse cannot wipe a list
  d = d || {};
  if(!Array.isArray(d.items)) d.items = [];
  d.items = d.items.map(s => ({
    text: (s && s.text) || '',
    date: (s && s.date) || '',
    time: (s && s.time) || '',
    done: !!(s && s.done)
  }));
  while(d.items.length && isItemEmpty(d.items[d.items.length - 1])) d.items.pop();
  return d;
}

async function fetchShitlist(){
  const res = await fetch(`${API_URL}?shitlist=1`);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return normalizeShit(await res.json());
}
async function postShitlist(items, baseRevision){
  // a force flag is deliberately absent: api.php rejects it for the shit-list
  const body = { type: 'shitlist', items, base_revision: baseRevision };
  return postApiJson(body);
}

function backupShitToLocal(items, baseRevision){
  try{
    localStorage.setItem('wp_shit_backup', JSON.stringify({ items, base_revision: baseRevision, savedAt: Date.now() }));
  }catch(_){}
}
function clearLocalShitBackup(){
  try{ localStorage.removeItem('wp_shit_backup'); }catch(_){}
}
function loadShitBackupFromLocal(){
  try{
    const raw = localStorage.getItem('wp_shit_backup');
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.items)) return null;
    if(BACKUP_TTL_MS < Date.now() - (parsed.savedAt || 0)){
      localStorage.removeItem('wp_shit_backup');
      return null;
    }
    return parsed;
  }catch(_){ return null; }
}

// Restores edits of a failed save from an earlier session, otherwise loads the
// server list. Never runs while a backlog save is pending or in flight,
// because that would clobber the freshly saved state with an older server copy.
async function loadShit(){
  if(shitDirty || shitInFlight || shitReDirty || modalLoc || moveSource) return; // stay out of open dialogs and pending moves
  const backup = loadShitBackupFromLocal();
  if(backup){
    shit = { items: normalizeShit({ items: backup.items }).items, revision: backup.base_revision || 0 };
    shitDirty = true;
    scheduleShitSave();
  }else{
    try{
      const fetched = normalizeShit(await fetchShitlist());
      // an edit, dialog or move may have appeared while the request was running
      if(shitDirty || shitInFlight || shitReDirty || modalLoc || moveSource) return;
      // a save that finished while this GET ran produced a newer revision
      if(shit && typeof shit.revision === 'number' && typeof fetched.revision === 'number' && fetched.revision < shit.revision) return;
      // Migration state keeps its flag; a backup can only exist with a save in
      // flight (caught by the guard above), so there is nothing to rescue here.
      shit = fetched;
      if(!fetched.migration) cacheShitToLocal(shit.items, shit.revision);
    }catch(e){
      console.error('Shit-Liste konnte nicht geladen werden', e);
      // the same guards apply: keep newer local state instead of stale cache
      if(shitDirty || shitInFlight || shitReDirty || modalLoc || moveSource) return;
      const cached = loadShitFromLocal();
      shit = { items: cached ? cached.items : [], revision: cached ? (cached.revision || 0) : 0 };
    }
  }
  shitNeedsPaint = true;
  renderShit();
  updateShitBtnState();
}

function shitCanUsePill(){
  const el = document.getElementById('saveStatus');
  if(!el) return false;
  const st = el.dataset.state;
  // 'saving' counts too, so an error path can never strand the pill in 'saving'
  return st === 'idle' || st === 'saving' || st === 'saved' || st === 'pending';
}

function scheduleShitSave(){
  if(shitSaveTimer) clearTimeout(shitSaveTimer);
  shitDirty = true;
  if(!saveInFlight && shitCanUsePill()) setSaveStatus('pending');
  shitSaveTimer = setTimeout(saveShitlist, SAVE_DEBOUNCE_MS);
}

async function flushShitSave(){
  if(shitSaveTimer){ clearTimeout(shitSaveTimer); shitSaveTimer = null; }
  if(shitDirty || shitReDirty) await saveShitlist();
}

async function saveShitlist(){
  if(!shitDirty || !shit) return;
  if(shitInFlight){ shitReDirty = true; return; }
  shitDirty = false;
  shitInFlight = true;
  if(!saveInFlight && shitCanUsePill()) setSaveStatus('saving'); // backlog-only saves stay visible in the pill
  const payloadItems = JSON.parse(JSON.stringify(shit.items)); // snapshot: retries must not pick up later edits
  const seqAtCopy = shitMoveSeq;
  const baseRevision = shit.revision;
  cacheShitToLocal(payloadItems, baseRevision);
  const tooLong = payloadItems.find(it => textTooLong(it.text));
  if(tooLong){
    // permanent client error: don't send a doomed payload, tell the user why
    shitInFlight = false;
    shitDirty = true;
    shitSaveFailed = true;
    backupShitToLocal(payloadItems, baseRevision);
    if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
    if(!shitTooLongAlerted){
      shitTooLongAlerted = true;
      alert('Ein Eintrag ist zu lang (max 8000 Byte). Bitte kürze ihn und tippe auf die Statusanzeige, um erneut zu speichern.');
    }
    return;
  }
  let attempt = 0;
  while(true){
    try{
      const result = await postShitlist(payloadItems, baseRevision);
      shit.revision = result.revision;
      shitInFlight = false;
      shitSaveErrorAlerted = false;
      shitSaveFailed = false;
      clearLocalShitBackup();
      cacheShitToLocal(payloadItems, result.revision);
      if(lastWeekMoveToShit && lastWeekMoveToShit.seq <= seqAtCopy) lastWeekMoveToShit = null;
      shitCapAlerted = false;
      shitTooLongAlerted = false;
      if(shitReDirty){
        shitReDirty = false;
        shitDirty = true;
        scheduleShitSave();
      }else if(!saveInFlight && !dirty && !reDirty && weekSaveFailed){
        setSaveStatus('error-save');
      }else if(!saveInFlight && !dirty && !reDirty && shitCanUsePill()){
        setSaveStatus('saved');
      }
      return;
    }catch(e){
      attempt++;
      if(e.status === 409){
        shitInFlight = false;
        shitReDirty = false;
        handleShitConflict(e.response);
        return;
      }
      if(e.status === 400){
        // permanent client error (e.g. item cap): no retry, keep a local backup
        shitInFlight = false;
        shitDirty = true;
        shitSaveFailed = true;
        backupShitToLocal(payloadItems, baseRevision);
        if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
        if(!shitCapAlerted){
          shitCapAlerted = true;
          alert('Der Server hat die Shit-Liste abgelehnt (z. B. mehr als 400 Einträge). Bitte lösche einige Einträge.');
        }
        return;
      }
      if(attempt > MAX_RETRIES){
        shitInFlight = false;
        shitDirty = true;
        shitSaveFailed = true;
        backupShitToLocal(payloadItems, baseRevision);
        if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
        if(!shitSaveErrorAlerted){
          shitSaveErrorAlerted = true;
          alert('Die Shit-Liste konnte nicht gespeichert werden – tippe auf die Statusanzeige, um es erneut zu versuchen.');
        }
        console.error('Shit-Liste speichern fehlgeschlagen', e);
        return;
      }
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
}

// Merges the server list with our pending items: the server keeps the
// positions, local entries that the server lacks are appended (non-destructive).
// Content identity of a backlog item: merge matching includes done, dedup
// checks compare text/date/time only so a done-toggle is a real difference.
function shitContentKey(it, withDone){
  return JSON.stringify(withDone
    ? [it.text, it.date, it.time, !!it.done]
    : [it.text, it.date, it.time]);
}
let shitMergeOverflow = null; // entries the last merge dropped because of the 400 cap
function mergeShitItems(serverItems, localItems){
  const keyOf = (it) => shitContentKey(it, true);
  const seen = new Set(serverItems.map(keyOf));
  const extra = [];
  (localItems || []).forEach(it => {
    if(!it || isItemEmpty(it)) return;
    const k = keyOf(it);
    if(!seen.has(k)){ extra.push(it); seen.add(k); }
  });
  const merged = normalizeShit({ items: [...serverItems, ...extra] }).items;
  // the save payload must stay under the cap; server entries keep their spots first
  shitMergeOverflow = merged.length > SHIT_MAX_ITEMS ? merged.slice(SHIT_MAX_ITEMS) : null;
  return shitMergeOverflow ? merged.slice(0, SHIT_MAX_ITEMS) : merged;
}

async function handleShitConflict(response){
  shitInFlight = true; // block parallel saves while the dialog is open
  shitConflictResolving = true; // backlog-cell dialogs/moves must not start: indices would go stale
  // Both options are safe for the server: merge keeps the server entries and
  // appends ours; discarding local new entries needs a second confirmation.
  const msg = 'Die Shit-Liste wurde zwischenzeitlich anderswo geändert.\n„OK“ = zusammenführen (Server-Einträge + neue Einträge behalten).\n„Abbrechen“ = Server-Version laden (eigene neue Einträge verwerfen).';
  const server = response && response.server;
  const serverRevision = (server && server.revision) || (response && response.revision) || 0;
  if(modalLoc || moveSource){
    // resolving now would invalidate open dialog/move positions — plain error path
    shitInFlight = false;
    shitConflictResolving = false;
    shitDirty = true;
    shitSaveFailed = true;
    backupShitToLocal(shit.items, shit.revision);
    if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
    return;
  }
  const choice = confirm(msg);
  let discard = false;
  if(!choice && confirm('Wirklich die Server-Version laden und eigene neue Einträge verwerfen?')){
    discard = true;
  }
  if(!discard && server && Array.isArray(server.items)){
    // merge is the safe default: server entries keep their positions, ours are appended
    const seqAtMerge = shitMoveSeq;
    const nextItems = mergeShitItems(server.items, shit.items);
    try{
      const result = await postShitlist(nextItems, serverRevision);
      // preserve edits that arrived while the request was in flight
      const finalItems = mergeShitItems(nextItems, shit.items);
      const changed = JSON.stringify(finalItems) !== JSON.stringify(nextItems);
      shit.items = finalItems;
      shit.revision = result.revision;
      shitSaveFailed = false;
      shitSaveErrorAlerted = false;
      clearLocalShitBackup();
      cacheShitToLocal(shit.items, result.revision);
      if(lastWeekMoveToShit && lastWeekMoveToShit.seq <= seqAtMerge) lastWeekMoveToShit = null;
      shitNeedsPaint = true;
      renderShit();
      if(shitMergeOverflow && shitMergeOverflow.length){
        // entries over the 400 cap could not be merged — say so, they are lost
        alert(`Die Shit-Liste ist voll (max 400): ${shitMergeOverflow.length} Einträge konnten beim Zusammenführen nicht übernommen werden.`);
        shitMergeOverflow = null;
      }
      if(changed){
        shitDirty = true;
        scheduleShitSave();
      }
    }catch(e){
      shitDirty = true; // keep the retry alive via the status pill
      shitSaveFailed = true;
      backupShitToLocal(shit.items, shit.revision);
      if(shitCanUsePill()) setSaveStatus('error-save'); // leave a pending conflict/offline pill untouched
      console.error('Shit-Liste Konflikt konnte nicht aufgelöst werden', e);
    }
  }else{
    // discard confirmed: load the server state as-is — no POST, nothing can be wiped
    if(server && Array.isArray(server.items)){
      shit = normalizeShit({ items: server.items });
      shit.revision = server.revision || (response.revision || 0);
      shitSaveFailed = false;
      shitSaveErrorAlerted = false;
      clearLocalShitBackup();
      cacheShitToLocal(shit.items, shit.revision);
      reinsertWeekMoveIntoShit();
      shitNeedsPaint = true;
    }else{
      shitDirty = true; // nothing to load: keep local edits for a later retry
    }
  }
  shitInFlight = false;
  shitConflictResolving = false;
  renderShit();
  if(shitDirty || shitReDirty){
    shitReDirty = false;
    shitDirty = true;
    if(!shitSaveFailed) scheduleShitSave();
  }
}

function loadShitFromLocal(){
  try{
    const raw = localStorage.getItem('wp_shit_cache');
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.items)) return null;
    if(Date.now() - (parsed.savedAt || 0) > BACKUP_TTL_MS){
      localStorage.removeItem('wp_shit_cache');
      return null;
    }
    return parsed;
  }catch(_){ return null; }
}
function cacheShitToLocal(items, revision){
  try{
    localStorage.setItem('wp_shit_cache', JSON.stringify({ items, revision, savedAt: Date.now() }));
  }catch(_){}
}

function renderShit(){
  const count = shit && shit.items ? shit.items.filter(i => !isItemEmpty(i)).length : 0;
  shitCount.textContent = count ? `(${count})` : '';
  if(!isShitSectionOpen()){
    // collapsed: only keep the count fresh, no cell DOM until opened
    if(shitBody.childElementCount) shitBody.innerHTML = '';
    return;
  }
  if(!shitNeedsPaint) return; // nothing changed since the last build
  shitNeedsPaint = false;
  shitBody.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'shit-grid';
  const total = shitCellCount();
  for(let i = 0; i < total; i++){
    const item = getShitItem(i);
    const empty = isItemEmpty(item);
    const cell = document.createElement('div');
    cell.className = 'shit-cell' + (empty ? ' empty' : '');
    cell.dataset.locType = 'shit';
    cell.dataset.locIndex = i;
    const meta = formatMeta(item);
    cell.innerHTML = `
      <div class="shit-entry-wrap" data-open-shit="${i}">
        <div class="shit-text${item.done ? ' done' : ''}" data-placeholder="…">${escapeHtml(firstLine(item.text))}</div>
        ${meta ? `<div class="meta">${escapeHtml(meta)}</div>` : ''}
      </div>
      <button class="del-btn" data-del-shit="${i}" title="Eintrag leeren">✕</button>
    `;
    grid.appendChild(cell);
  }
  shitBody.appendChild(grid);
  attachShitHandlers();
}

function attachShitHandlers(){
  shitBody.querySelectorAll('[data-open-shit]').forEach(el => {
    el.addEventListener('click', () => {
      if(moveSource || isClickSuppressed()) return;
      if(!shit || !Array.isArray(shit.items)){ loadShit(); return; }
      openModal({type:'shit', index: parseInt(el.dataset.openShit)});
    });
  });
  shitBody.querySelectorAll('.del-btn').forEach(el => {
    el.addEventListener('click', () => {
      if(isClickSuppressed()) return;
      if(shitConflictResolving){ flashFooterHint('Konfliktauflösung läuft — bitte kurz warten.'); return; }
      setShitItem(parseInt(el.dataset.delShit), emptySlot());
      scheduleShitSave();
      renderShit();
    });
  });
  shitBody.querySelectorAll('[data-loc-type="shit"]').forEach(el => {
    el.addEventListener('pointerdown', onRowPointerDown);
  });
}

function isShitSectionOpen(){ return shitBody.classList.contains('open'); }
function openShitSection(){
  if(isShitSectionOpen()) return;
  shitBody.classList.add('open');
  shitToggle.textContent = 'ausblenden';
  shitHead.setAttribute('aria-expanded', 'true');
  try{ localStorage.setItem('wp_shit_open', '1'); }catch(_){}
  shitNeedsPaint = true;
  if(!shit) loadShit();
  renderShit();
}
function toggleShitSection(){
  if(isShitSectionOpen()){
    shitBody.classList.remove('open');
    shitToggle.textContent = 'anzeigen';
    shitHead.setAttribute('aria-expanded', 'false');
    try{ localStorage.setItem('wp_shit_open', '0'); }catch(_){}
    if(moveSource && moveSource.type === 'shit') cancelMove(); // cells vanish, week moves continue
    return;
  }
  openShitSection();
}
shitHead.addEventListener('click', toggleShitSection);
shitHead.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleShitSection(); }
});

/* ===================== MOVE (long-press + tap target) ===================== */

const LONG_PRESS_MS = 350;
const PRESS_CANCEL_DIST = 10;
let moveSource = null;
let pressTimer = null;
let pressCleanup = null;
let clickSuppressUntil = 0;

function isClickSuppressed(){
  return Date.now() < clickSuppressUntil;
}

function readLoc(el){
  const type = el.dataset.locType;
  if(type === 'day') return {type:'day', day: el.dataset.locDay, index: parseInt(el.dataset.locIndex)};
  if(type === 'note') return {type:'note', section: el.dataset.locSection, id: el.dataset.locId};
  if(type === 'notelist') return {type:'notelist', section: el.dataset.locSection};
  if(type === 'shit') return {type:'shit', index: parseInt(el.dataset.locIndex)};
  return null;
}
function sameLoc(a, b){
  if(!a || !b || a.type !== b.type) return false;
  if(a.type === 'day') return a.day === b.day && a.index === b.index;
  if(a.type === 'note') return a.section === b.section && a.id === b.id;
  if(a.type === 'notelist') return a.section === b.section;
  if(a.type === 'shit') return a.index === b.index;
  return false;
}
function getValue(loc){
  if(loc.type === 'day') return {...data.days[loc.day][loc.index]};
  if(loc.type === 'note'){
    const item = data.notes[loc.section].find(i => i.id === loc.id);
    return item ? {text:item.text, date:item.date, time:item.time, done:item.done} : {text:'', date:'', time:'', done:false};
  }
  if(loc.type === 'shit') return getShitItem(loc.index);
  return {text:'', date:'', time:'', done:false};
}
function setDaySlot(loc, val){
  data.days[loc.day][loc.index] = {
    text: val.text || '',
    date: val.date || '',
    time: val.time || '',
    done: !!val.done
  };
}
function insertNoteItem(loc, val, beforeId){
  const arr = data.notes[loc.section];
  const newItem = {id: uid(), text: val.text || '', date: val.date || '', time: val.time || '', done: !!val.done};
  if(beforeId){
    const idx = arr.findIndex(i => i.id === beforeId);
    if(idx > -1){ arr.splice(idx, 0, newItem); return; }
  }
  arr.push(newItem);
}
function removeNoteLoc(loc){
  removeNoteItemById(loc.section, loc.id);
}

function performMove(sourceLoc, targetLoc){
  const sourceVal = getValue(sourceLoc);

  if(sourceLoc.type === 'day' && targetLoc.type === 'day'){
    const targetVal = getValue(targetLoc);
    setDaySlot(sourceLoc, targetVal);
    setDaySlot(targetLoc, sourceVal);
    return;
  }
  if(sourceLoc.type === 'day' && (targetLoc.type === 'note' || targetLoc.type === 'notelist')){
    const beforeId = targetLoc.type === 'note' ? targetLoc.id : null;
    insertNoteItem(targetLoc, sourceVal, beforeId);
    setDaySlot(sourceLoc, emptySlot());
    return;
  }
  if(sourceLoc.type === 'note' && targetLoc.type === 'day'){
    const targetVal = getValue(targetLoc);
    removeNoteLoc(sourceLoc);
    setDaySlot(targetLoc, sourceVal);
    if(targetVal.text){
      insertNoteItem({type:'notelist', section: sourceLoc.section}, targetVal, null);
    }
    return;
  }
  if(sourceLoc.type === 'note' && (targetLoc.type === 'note' || targetLoc.type === 'notelist')){
    const beforeId = targetLoc.type === 'note' ? targetLoc.id : null;
    removeNoteLoc(sourceLoc);
    insertNoteItem(targetLoc, sourceVal, beforeId);
    return;
  }
  if(sourceLoc.type === 'shit' && targetLoc.type === 'shit'){
    const targetVal = getValue(targetLoc);
    setShitItem(targetLoc.index, sourceVal);
    setShitItem(sourceLoc.index, targetVal);
    return;
  }
  if(sourceLoc.type === 'day' && targetLoc.type === 'shit'){
    const targetVal = getValue(targetLoc);
    setDaySlot(sourceLoc, targetVal);
    setShitItem(targetLoc.index, sourceVal);
    return;
  }
  if(sourceLoc.type === 'shit' && targetLoc.type === 'day'){
    const targetVal = getValue(targetLoc);
    setShitItem(sourceLoc.index, targetVal);
    setDaySlot(targetLoc, sourceVal);
    return;
  }
  if(sourceLoc.type === 'note' && targetLoc.type === 'shit'){
    // cross-store swaps into occupied cells are blocked in commitMove, so a
    // note→shit move never leaves a displaced value to preserve
    removeNoteLoc(sourceLoc);
    setShitItem(targetLoc.index, sourceVal);
    return;
  }
  if(sourceLoc.type === 'shit' && (targetLoc.type === 'note' || targetLoc.type === 'notelist')){
    const beforeId = targetLoc.type === 'note' ? targetLoc.id : null;
    insertNoteItem(targetLoc, sourceVal, beforeId);
    setShitItem(sourceLoc.index, emptySlot());
    return;
  }
}

function isValidDropTarget(el){
  const type = el.dataset.locType;
  if(!type) return false;
  if(type === 'day') return true;
  if(type === 'shit') return true;
  if(type === 'note' || type === 'notelist'){
    return DRAG_SECTIONS.includes(el.dataset.locSection);
  }
  return false;
}

function onRowPointerDown(e){
  if(isClickSuppressed()) return;
  if(e.target.closest('input, button, .dot')) return;
  if(moveSource) return;
  const sourceRow = e.currentTarget;
  const sourceLoc = readLoc(sourceRow);
  if(!sourceLoc || sourceLoc.type === 'notelist') return;
  if(sourceLoc.type === 'shit' && shitConflictResolving) return; // no stale move sources
  if(isItemEmpty(getValue(sourceLoc))) return;

  const startX = e.clientX;
  const startY = e.clientY;

  const move = (ev) => {
    if(Math.hypot(ev.clientX - startX, ev.clientY - startY) > PRESS_CANCEL_DIST){
      cleanupLongPress();
    }
  };
  const up = () => cleanupLongPress();
  const cancel = () => cleanupLongPress();

  function cleanup(){
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', cancel);
  }

  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', cancel);

  pressCleanup = cleanup;
  pressTimer = setTimeout(() => {
    cleanupLongPress();
    moveSource = sourceLoc;
    suppressNextClick();
    if(navigator.vibrate) navigator.vibrate(15);
    applyMoveHighlight();
  }, LONG_PRESS_MS);
}

function cleanupLongPress(){
  if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  if(pressCleanup){ pressCleanup(); pressCleanup = null; }
}

function onMoveModeClick(e){
  if(!moveSource) return;
  if(isClickSuppressed()){
    e.stopPropagation();
    e.preventDefault();
    cleanupLongPress();
    return;
  }

  const target = e.target.closest('[data-loc-type]');
  if(!target){
    e.stopPropagation();
    e.preventDefault();
    cancelMove();
    return;
  }

  const targetLoc = readLoc(target);
  if(!targetLoc || !isValidDropTarget(target) || sameLoc(targetLoc, moveSource)){
    e.stopPropagation();
    e.preventDefault();
    cancelMove();
    return;
  }

  e.stopPropagation();
  e.preventDefault();
  cleanupLongPress();
  commitMove(targetLoc);
}

let footerFlashTimer = null;
function flashFooterHint(text){
  const footer = document.getElementById('footerNote');
  if(!footer) return;
  footer.textContent = text;
  if(footerFlashTimer) clearTimeout(footerFlashTimer);
  footerFlashTimer = setTimeout(applyMoveHighlight, 2500);
}

function commitMove(targetLoc){
  const sourceLoc = moveSource;
  const touchesShit = sourceLoc.type === 'shit' || targetLoc.type === 'shit';
  if(touchesShit && (!shit || !Array.isArray(shit.items))){
    // Backlog not loaded yet: cancel and (re)load — the move can be repeated.
    moveSource = null;
    applyMoveHighlight();
    loadShit();
    return;
  }
  if(targetLoc.type === 'shit' && targetLoc.index >= SHIT_MAX_ITEMS){
    // unreachable target (the grid renders at most SHIT_MAX_ITEMS cells)
    moveSource = null;
    applyMoveHighlight();
    flashFooterHint('Die Shit-Liste ist voll (max 400 Einträge).');
    return;
  }
  if(targetLoc.type === 'shit' && shitConflictResolving){
    // the merge replaces the list layout — retry the move after resolution
    moveSource = null;
    applyMoveHighlight();
    flashFooterHint('Konfliktauflösung läuft — bitte kurz warten.');
    return;
  }
  const movedFromShit = sourceLoc.type === 'shit' ? getShitItem(sourceLoc.index) : null;
  const movedFromWeek = (sourceLoc.type !== 'shit' && targetLoc.type === 'shit') ? getValue(sourceLoc) : null;
  const crossesStores = (sourceLoc.type === 'shit') !== (targetLoc.type === 'shit');
  const targetIsList = targetLoc.type === 'note' || targetLoc.type === 'notelist';
  if(crossesStores && !targetIsList && !isItemEmpty(getValue(targetLoc))){
    // a cross-store swap into an occupied cell would orphan the displaced entry
    moveSource = null;
    applyMoveHighlight();
    flashFooterHint('Zielzelle belegt — zuerst freiräumen.');
    return;
  }
  performMove(sourceLoc, targetLoc);
  rememberShitMoveToWeek(movedFromShit, movedFromWeek, targetLoc);
  moveSource = null;
  const touchesWeek = sourceLoc.type !== 'shit' || targetLoc.type !== 'shit';
  if(touchesWeek) scheduleSave();
  if(touchesShit) scheduleShitSave();
  requestAnimationFrame(() => render());
}

// Snapshot of the last shit→week move; used to re-insert the moved entry
// when a week conflict resolution reverts the week (cross-store safety net).
let lastShitMoveToWeek = null;
let lastWeekMoveToShit = null;
// One rescue record per direction; records are only cleared via the seq check
// after the corresponding save succeeded — unrelated moves never wipe them.
function rememberShitMoveToWeek(movedFromShit, movedFromWeek, targetLoc){
  if(targetLoc.type === 'shit'){
    if(movedFromWeek) lastWeekMoveToShit = { val: movedFromWeek, seq: ++shitMoveSeq };
    return;
  }
  if(!movedFromShit){ return; }
  lastShitMoveToWeek = {
    val: movedFromShit,
    week: weekParam(currentWeekStart),
    day: targetLoc.type === 'day' ? targetLoc.day : null,
    index: targetLoc.type === 'day' ? targetLoc.index : null,
    section: (targetLoc.type === 'note' || targetLoc.type === 'notelist') ? targetLoc.section : null,
    seq: ++shitMoveSeq
  };
}
// Re-inserts the entry of the last shit→week move when a week conflict
// resolution reverts the week — otherwise the entry was lost in both stores.
function reinsertShitMoveIntoWeek(){
  const moved = lastShitMoveToWeek;
  lastShitMoveToWeek = null;
  if(!moved || !moved.val || isItemEmpty(moved.val)) return;
  if(moved.week && moved.week !== weekParam(currentWeekStart)){
    return; // the record belongs to a different week — not this conflict
  }
  // Only look inside the move's own target: an identical entry elsewhere is an
  // unrelated item ("two Milch") and must not block the rescue.
  const targetKey = shitContentKey(moved.val, false);
  const sameItem = (a) => a && !isItemEmpty(a) && shitContentKey(a, false) === targetKey;
  const alreadyThere = moved.day
    ? (data.days[moved.day] || []).some(sameItem)
    : (moved.section ? (data.notes[moved.section] || []).some(sameItem) : false);
  if(alreadyThere) return; // another device already persisted this move
  if(moved.day){
    let idx = data.days[moved.day].findIndex(isItemEmpty);
    if(idx === -1){
      // no free slot anymore: fall back to appending in Diverses
      data.notes.Diverses.push({id: uid(), text: moved.val.text, date: moved.val.date, time: moved.val.time, done: moved.val.done});
    }else{
      data.days[moved.day][idx] = {text: moved.val.text || '', date: moved.val.date || '', time: moved.val.time || '', done: !!moved.val.done};
    }
  }else if(moved.section){
    data.notes[moved.section] = data.notes[moved.section] || [];
    data.notes[moved.section].push({id: uid(), text: moved.val.text, date: moved.val.date, time: moved.val.time, done: moved.val.done});
  }
}

// Re-appends the entry of the last week→backlog move when the backlog
// conflict resolution loads the server state (which never contained it).
function reinsertWeekMoveIntoShit(){
  const moved = lastWeekMoveToShit;
  lastWeekMoveToShit = null;
  if(!moved || !moved.val || isItemEmpty(moved.val)) return;
  if(!shit || !Array.isArray(shit.items)) return;
  // if the week→backlog save actually landed despite the conflict, skip the
  // re-insert instead of adding a second copy
  const targetKey = shitContentKey(moved.val, false);
  const sameItem = (a) => a && !isItemEmpty(a) && shitContentKey(a, false) === targetKey;
  if(shit.items.some(sameItem)) return;
  shit.items.push({ text: moved.val.text || '', date: moved.val.date || '', time: moved.val.time || '', done: !!moved.val.done });
  shitNeedsPaint = true;
  shitDirty = true; // the end-of-conflict block re-saves the rescued entry
}

function cancelMove(){
  moveSource = null;
  applyMoveHighlight();
}

function findLocElement(loc){
  if(!loc) return null;
  if(loc.type === 'day'){
    return document.querySelector(`[data-loc-type="day"][data-loc-day="${loc.day}"][data-loc-index="${loc.index}"]`);
  }
  if(loc.type === 'note'){
    return document.querySelector(`[data-loc-type="note"][data-loc-section="${loc.section}"][data-loc-id="${loc.id}"]`);
  }
  if(loc.type === 'shit'){
    return document.querySelector(`[data-loc-type="shit"][data-loc-index="${loc.index}"]`);
  }
  return null;
}

function applyMoveHighlight(){
  const any = document.querySelector('.move-source');
  if(any) any.classList.remove('move-source');
  document.body.classList.toggle('move-mode', !!moveSource);
  const footer = document.getElementById('footerNote');
  if(footer){
    footer.textContent = moveSource
      ? 'Ziel antippen zum Verschieben · nochmal antippen zum Abbrechen · gespeichert automatisch'
      : 'Zum Bearbeiten tippen · Punkt anklicken zum Erledigen · lang drücken, dann Ziel antippen · gespeichert automatisch';
  }
  if(!moveSource) return;
  const el = findLocElement(moveSource);
  if(el){
    el.classList.add('move-source');
  } else {
    moveSource = null;
  }
}

function suppressNextClick(){
  clickSuppressUntil = Date.now() + 500;
}

/* ===================== EDIT MODAL ===================== */
/* Lives outside #stage, so it is never affected by the page rotation. */

const modalOverlay = document.getElementById('modalOverlay');
const modalDate = document.getElementById('modalDate');
const modalTime = document.getElementById('modalTime');
const modalText = document.getElementById('modalText');
const modalShitBtn = document.getElementById('modalShit');

let modalLoc = null;
let modalDoneState = false;

// The 💩 button sends the item being edited to the global backlog.
// Only for week items with text; pointless inside the backlog itself.
function updateShitBtnState(){
  // also requires the backlog to be loaded, so 💩 never discards entries silently
  const enabled = !!modalLoc && modalLoc.type !== 'shit' && modalText.value.trim() !== ''
    && !!(shit && Array.isArray(shit.items)) && shit.items.length < SHIT_MAX_ITEMS;
  modalShitBtn.classList.toggle('off', !enabled);
}

// Takes the dialog's current text/time (the date is dropped so the entry stays
// undated in the backlog), moves the item and clears its source location.
function sendModalToShitlist(){
  if(!modalLoc || modalLoc.type === 'shit' || modalSaving) return;
  if(shitConflictResolving) return; // the merge would rewrite the backlog layout
  if(!shit || !Array.isArray(shit.items)){ loadShit(); closeModal(); return; }
  if(shit.items.length >= SHIT_MAX_ITEMS){
    if(!shitCapAlerted){
      shitCapAlerted = true;
      alert('Die Shit-Liste ist voll (max 400 Einträge).');
    }
    return;
  }
  const val = { text: modalText.value, date: '', time: modalTime.value, done: modalDoneState };
  if(!isItemEmpty(val)){
    setShitItem(shit.items.length, val);
    removeFromLocation(modalLoc);
    lastWeekMoveToShit = { val: val, seq: ++shitMoveSeq };
    scheduleShitSave();
    scheduleSave();
  }
  closeModal();
  openShitSection();
  render();
}

function openModal(loc){
  if(loc && loc.type === 'shit' && shitConflictResolving) return; // indices would go stale
  cancelMove();
  modalLoc = loc;
  const val = getValue(loc);
  modalDoneState = !!val.done;
  modalDate.value = val.date || '';
  modalTime.value = val.time || '';
  modalText.value = val.text || '';
  updateShitBtnState();
  modalOverlay.classList.remove('hidden');
  requestAnimationFrame(() => modalText.focus());
}
modalText.addEventListener('input', updateShitBtnState);

function closeModal(){
  modalSaving = false;
  modalOverlay.classList.add('hidden');
  modalLoc = null;
}
// User-facing close (Cancel, overlay tap, Esc): refused while the dialog is
// mid-save/relocation — source indices would drift while requests run.
function requestCloseModal(){
  if(modalSaving) return;
  closeModal();
}

function applyValueInPlace(loc, val){
  if(loc.type === 'day'){
    setDaySlot(loc, val);
  } else if(loc.type === 'note'){
    const item = data.notes[loc.section].find(i => i.id === loc.id);
    if(item){ item.text = val.text; item.date = val.date; item.time = val.time; item.done = !!val.done; }
  } else if(loc.type === 'shit'){
    setShitItem(loc.index, val);
  }
}
function removeFromLocation(loc){
  if(loc.type === 'day'){
    setDaySlot(loc, emptySlot());
  } else if(loc.type === 'note'){
    removeNoteItemById(loc.section, loc.id);
    if(data.notes[loc.section].length === 0) data.notes[loc.section].push(newNoteItem());
  } else if(loc.type === 'shit'){
    setShitItem(loc.index, emptySlot());
  }
}

// A day-grid item (a note item in "Ausblick"/"Diverses", or a shit-list cell)
// whose date is set is relocated into that date's day column — same-week moves
// happen in memory, moves into a different week are persisted directly against
// that week's stored data.
async function relocateToDay(sourceLoc, val, targetMonday, targetDay){
  const sameWeek = weekParam(targetMonday) === weekParam(currentWeekStart);
  const isShitSource = sourceLoc.type === 'shit';
  const sourceSnapshot = isShitSource ? getShitItem(sourceLoc.index) : null;
  // While the cross-week requests run, the dialog can be interacted with and
  // the list can change: only touch the source cell if it still holds the
  // content captured at relocation start.
  const shitCellUnchanged = () => {
    if(!isShitSource) return true;
    const cur = getShitItem(sourceLoc.index);
    return (cur.text || '') === (sourceSnapshot.text || '')
      && (cur.date || '') === (sourceSnapshot.date || '')
      && (cur.time || '') === (sourceSnapshot.time || '')
      && !!cur.done === !!sourceSnapshot.done;
  };
  const clearSourceIfUnchanged = () => {
    if(shitCellUnchanged()){ removeFromLocation(sourceLoc); return; }
    flashFooterHint('Der backlog-Eintrag hat sich geändert — Quelle nicht gelöscht. Bitte prüfen.');
  };
  const restoreSourceOrHint = () => {
    if(shitCellUnchanged()){ applyValueInPlace(sourceLoc, val); return; }
    flashFooterHint('Der backlog-Eintrag hat sich geändert — nicht überschrieben. Bitte prüfen.');
  };
  const saveChanges = () => {
    // always save the week: the same-week branch changes it, and for unchanged
    // content the hash-based idempotency makes the save a server-side no-op
    scheduleSave();
    if(isShitSource) scheduleShitSave();
  };

  if(sameWeek){
    const idx = data.days[targetDay].findIndex(isItemEmpty);
    if(idx === -1){
      alert(`Kein freier Platz am ${targetDay}. Eintrag wurde nicht verschoben.`);
      restoreSourceOrHint();
      saveChanges();
      render();
      return;
    }
    clearSourceIfUnchanged();
    setDaySlot({type:'day', day: targetDay, index: idx}, val);
    if(isShitSource) lastShitMoveToWeek = { val: val, day: targetDay, index: idx, week: weekParam(currentWeekStart), seq: ++shitMoveSeq };
    saveChanges();
    render();
    return;
  }

  try{
    await flushSave();
    let targetLoaded = await fetchWeekData(targetMonday);
    let targetData = normalize(targetLoaded);
    let targetRevision = targetLoaded.revision || 0;
    const idx = targetData.days[targetDay].findIndex(isItemEmpty);
    if(idx === -1){
      alert(`Kein freier Platz am ${targetDay} in der Zielwoche. Eintrag wurde nicht verschoben.`);
      restoreSourceOrHint();
      saveChanges();
      render();
      return;
    }
    targetData.days[targetDay][idx] = {
      text: val.text || '', date: val.date || '', time: val.time || '', done: !!val.done
    };
    await postWeekData(targetMonday, targetData, targetRevision);
    // clear only when the source cell still holds what was relocated
    clearSourceIfUnchanged();
    saveChanges();
    render();
    loadNextWeekPreview(); // the write may have landed in next week's data — refresh the lookahead
  }catch(e){
    if(e.status === 409){
      // Server version changed between fetch and write: retry once with fresh data.
      try{
        const reloaded = await fetchWeekData(targetMonday);
        const targetData = normalize(reloaded);
        const idx = targetData.days[targetDay].findIndex(isItemEmpty);
        if(idx !== -1){
          targetData.days[targetDay][idx] = {text: val.text || '', date: val.date || '', time: val.time || '', done: !!val.done};
          await postWeekData(targetMonday, targetData, reloaded.revision || 0);
          clearSourceIfUnchanged();
          saveChanges();
          render();
          loadNextWeekPreview();
          return;
        }
      }catch(_){}
    }
    console.error('Verschieben in andere Woche fehlgeschlagen', e);
    alert('Verschieben in die Zielwoche ist fehlgeschlagen. Eintrag bleibt hier.');
    restoreSourceOrHint();
    saveChanges();
    render();
  }
}

let modalSaving = false;
async function saveModal(){
  if(!modalLoc || modalSaving) return;
  const loc = modalLoc;
  const val = {
    text: modalText.value,
    date: modalDate.value,
    time: modalTime.value,
    done: modalDoneState
  };

  // empty backlog cell: don't store a meta-only husk, just clear it
  if(loc.type === 'shit' && isItemEmpty(val)){
    setShitItem(loc.index, emptySlot());
    scheduleShitSave();
    render();
    closeModal();
    return;
  }

  const relocatable = !!val.date && (
    loc.type === 'day' || loc.type === 'shit' ||
    (loc.type === 'note' && (loc.section === 'Ausblick' || loc.section === 'Diverses'))
  );

  modalSaving = true;
  try{
    if(relocatable){
      const targetMonday = mondayForDateStr(val.date);
      const targetDay = dateToDayName(val.date);
      const alreadyThere = loc.type === 'day' && loc.day === targetDay
        && weekParam(targetMonday) === weekParam(currentWeekStart);
      if(targetMonday && targetDay && !alreadyThere){
        await relocateToDay(loc, val, targetMonday, targetDay);
        closeModal();
        return;
      }
    }
    applyValueInPlace(loc, val);
    if(loc.type === 'shit') scheduleShitSave(); else scheduleSave();
    render();
    closeModal();
  } finally {
    modalSaving = false;
  }
}

function clearModal(){
  if(!modalLoc || modalSaving) return;
  if(modalLoc.type === 'day'){
    setDaySlot(modalLoc, emptySlot());
  } else if(modalLoc.type === 'note'){
    const item = data.notes[modalLoc.section].find(i => i.id === modalLoc.id);
    if(item){ item.text = ''; item.date = ''; item.time = ''; item.done = false; }
  } else if(modalLoc.type === 'shit'){
    setShitItem(modalLoc.index, emptySlot());
  }
  if(modalLoc.type === 'shit') scheduleShitSave(); else scheduleSave();
  render();
  closeModal();
}

document.getElementById('modalSave').addEventListener('click', saveModal);
document.getElementById('modalCancel').addEventListener('click', requestCloseModal);
document.getElementById('modalClear').addEventListener('click', clearModal);
document.getElementById('modalShit').addEventListener('click', sendModalToShitlist);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) requestCloseModal();
});
document.addEventListener('keydown', (e) => {
  if(moveSource && e.key === 'Escape'){ cancelMove(); return; }
  if(modalOverlay.classList.contains('hidden')) return;
  if(e.key === 'Escape') requestCloseModal();
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveModal();
});
document.addEventListener('click', onMoveModeClick, true);

/* ===================== ROTATE PAGE ===================== */
/* Rotation is applied to #stageViewport (never to the content inside it),
   using a well-known CSS trick for rotating a scrollable box 90°/270°:
   rotate around the top-left corner, then translate back into place by
   exactly 100% of the box's own (pre-rotation) width or height. Because
   that's a percentage of the element's own box rather than a JS-measured
   pixel value, it stays correct no matter how content height changes or
   where the box is scrolled — nothing to recompute, no resize handler
   needed; 100vh/100vw already track the viewport on their own. */

let pageRotation = 0;
const stage = document.getElementById('stage');
const stageViewport = document.getElementById('stageViewport');

function applyRotation(){
  const sideways = pageRotation % 180 === 90;
  stageViewport.classList.toggle('rotated-host', sideways);
  document.body.classList.toggle('rotated-lock', sideways);
  stage.classList.remove('edge-inset-top', 'edge-inset-bottom');

  if(pageRotation === 0){
    stageViewport.style.transform = '';
  } else if(pageRotation === 180){
    stageViewport.style.transform = 'rotate(180deg)';
  } else if(pageRotation === 90){
    stageViewport.style.transform = 'rotate(90deg) translateY(-100%)';
    stage.classList.add('edge-inset-top'); // local top lands on the visual right after a 90° turn
  } else { // 270
    stageViewport.style.transform = 'rotate(270deg) translateX(-100%)';
    stage.classList.add('edge-inset-bottom'); // local bottom lands on the visual right after a 270° turn
  }
}

document.getElementById('rotateBtn').addEventListener('click', () => {
  pageRotation = (pageRotation + 90) % 360;
  applyRotation();
});

/* ===================== NAV ===================== */

async function goToPrevWeek(){
  await flushSave();
  currentWeekStart.setDate(currentWeekStart.getDate()-7);
  currentWeekStart = getMonday(currentWeekStart);
  loadWeek();
}
async function goToNextWeek(e){
  await flushSave();
  currentWeekStart.setDate(currentWeekStart.getDate()+7);
  currentWeekStart = getMonday(currentWeekStart);
  loadWeek();
}

document.getElementById('prevWeek').addEventListener('click', goToPrevWeek);
document.getElementById('nextWeek').addEventListener('click', goToNextWeek);

/* ===================== CLOSE WEEK ===================== */
/* "Abschließen" carries unfinished Kaufen/Diverses items over to next week,
   discards the done ones, and marks the week closed (big X across the grid).
   Reopening just clears the flag again — no data is moved back. */

const CARRY_SECTIONS = ['Kaufen','Diverses'];
let closingWeek = false;

async function toggleWeekClosed(){
  if(closingWeek) return;

  if(data.closed){
    data.closed = false;
    scheduleSave();
    render();
    return;
  }

  if(!confirm('Woche abschließen? Offene Einträge aus "Kaufen" und "Diverses" werden in die nächste Woche verschoben.')) return;

  closingWeek = true;
  try{
    await flushSave();
    const carry = {};
    let anyToMove = false;
    CARRY_SECTIONS.forEach(section => {
      carry[section] = data.notes[section].filter(i => !isItemEmpty(i) && !i.done);
      if(carry[section].length) anyToMove = true;
    });

    if(anyToMove){
      const nextMonday = new Date(currentWeekStart);
      nextMonday.setDate(nextMonday.getDate() + 7);
      const nextLoaded = await fetchWeekData(nextMonday);
      const nextData = normalize(nextLoaded);
      const nextRevision = nextLoaded.revision || 0;
      CARRY_SECTIONS.forEach(section => {
        carry[section].forEach(item => {
          nextData.notes[section].push({id: uid(), text: item.text, date: item.date, time: item.time, done: false});
        });
      });
      await postWeekData(nextMonday, nextData, nextRevision);
      loadNextWeekPreview();
    }

    CARRY_SECTIONS.forEach(section => {
      data.notes[section] = [ newNoteItem() ];
    });
    data.closed = true;
    scheduleSave();
    render();
  }catch(e){
    console.error('Woche abschließen fehlgeschlagen', e);
    alert('Woche konnte nicht abgeschlossen werden (Verschieben in die nächste Woche ist fehlgeschlagen).');
  } finally {
    closingWeek = false;
  }
}

closeWeekBtn.addEventListener('click', toggleWeekClosed);

window.addEventListener('beforeunload', (e) => {
  if(dirty || reDirty || saveInFlight || shitDirty || shitReDirty || shitInFlight){
    flushSave();
    flushShitSave();
    e.preventDefault();
    e.returnValue = '';
  }
});

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    flushSave();
    flushShitSave();
  }else if(document.visibilityState === 'visible'){
    if(!saveBlocked) loadWeek(); // when blocked, the week retries on its next action
    loadShit(); // independent store — refresh even when the week is blocked
  }
});

loadWeek();
loadShit();

// Restore the open/closed state of the shit-list section
try{
  if(localStorage.getItem('wp_shit_open') === '1'){
    shitBody.classList.add('open');
    shitToggle.textContent = 'ausblenden';
    shitHead.setAttribute('aria-expanded', 'true');
    shitNeedsPaint = true;
    renderShit();
  }
}catch(_){}
